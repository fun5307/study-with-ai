<!doctype html><html lang="ko"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>오늘의 음악 추천</title><link rel="stylesheet" href="style.css" /><script src="https://www.youtube.com/iframe_api"></script><script src="script.js" defer></script></head><body data-mood="focus"><main><header><p>DAILY SOUND</p><h1>오늘의 음악 추천</h1><span>지금의 기분에 맞는 한 곡을 찾아보세요.</span></header><section class="moods" aria-label="기분 선택"><button class="mood active" data-mood="focus">집중</button><button class="mood" data-mood="rest">휴식</button><button class="mood" data-mood="energy">신나는</button><button class="mood" data-mood="mood">감성적인</button></section><section class="player"><div class="record" id="record"><div class="label">TODAY<br />SOUND</div></div><div class="info"><p id="mood-label">집중</p><h2 id="song-title">추천곡을 불러와 보세요</h2><p id="artist">아래 버튼을 누르면 YouTube에서 검색합니다.</p><button id="recommend" class="primary">다른 곡 추천받기</button><button id="reason-button" class="text-button" aria-expanded="false">왜 이 곡인가요?</button><p id="reason" hidden></p><div class="controls"><button id="play" aria-label="재생 또는 일시정지">▶</button><input id="progress" type="range" min="0" max="100" value="0" aria-label="재생 위치" /><button id="like" aria-pressed="false">♡ 좋아요</button></div></div></section><div id="youtube-player" aria-label="YouTube 재생기"></div><section class="history"><h2>오늘 들은 곡</h2><ul id="history-list"><li>아직 선택한 곡이 없습니다.</li></ul></section></main></body></html>
