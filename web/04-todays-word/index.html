<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>오늘의 말씀</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Gowun+Batang&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="page">
    <header class="page-header"><div><p class="eyebrow">TODAY'S WORD</p><h1>오늘의 말씀</h1><p class="date" id="today-date"></p></div><button class="icon-button" id="theme-button" type="button" aria-label="다크 모드로 바꾸기">☾</button></header>
    <nav class="topic-list" aria-label="말씀 주제">
      <button class="topic-button is-active" type="button" data-topic="전체">전체</button><button class="topic-button" type="button" data-topic="위로">위로</button><button class="topic-button" type="button" data-topic="감사">감사</button><button class="topic-button" type="button" data-topic="용기">용기</button><button class="topic-button" type="button" data-topic="평안">평안</button>
    </nav>
    <section class="word-card" aria-live="polite">
      <span class="card-orb orb-one" aria-hidden="true"></span><span class="card-orb orb-two" aria-hidden="true"></span>
      <p class="topic-label" id="topic-label"></p><p class="verse" id="verse-text"></p><p class="reference" id="verse-reference"></p><button class="heart-button" id="favorite-button" type="button" aria-label="저장한 말씀에 추가하기">♡</button>
    </section>
    <p class="reflection outside-reflection" id="reflection-text"></p>
    <div class="actions"><button class="primary-button" id="random-button" type="button">랜덤 말씀 보기 <span>→</span></button><button class="secondary-button" id="share-button" type="button">사이트 공유하기</button><button class="secondary-button" id="saved-button" type="button">저장한 말씀 <span id="saved-count">0</span></button></div>
    <section class="saved-section" id="saved-section" hidden><div class="saved-heading"><h2>저장한 말씀</h2><button class="text-button" id="close-saved-button" type="button">닫기</button></div><ul class="saved-list" id="saved-list"></ul></section>
    <p class="hint" id="status-message">주제를 선택하거나 랜덤 버튼을 눌러 보세요.</p>
    <section class="journal-section" aria-labelledby="journal-title">
      <div class="journal-heading"><p class="journal-eyebrow">MY REFLECTION</p><h2 id="journal-title">오늘의 묵상</h2><p>오늘 마음에 남은 생각을 천천히 적어 보세요.</p></div>
      <form id="journal-form"><label class="sr-only" for="journal-input">오늘의 묵상</label><textarea id="journal-input" rows="5" maxlength="200" placeholder="여기에 오늘의 묵상을 적어 보세요."></textarea><div class="journal-footer"><span>이 내용은 이 브라우저에만 저장됩니다.</span><div class="journal-buttons"><button class="journal-history-button" id="reflection-history-button" type="button">저장한 묵상 보기</button><button class="journal-save-button" type="submit">묵상 저장하기</button></div></div></form>
    </section>
    <section class="reflection-history" id="reflection-history" hidden aria-labelledby="reflection-history-title"><div class="saved-heading"><h2 id="reflection-history-title">저장한 묵상</h2><button class="text-button" id="close-reflection-history-button" type="button">닫기</button></div><ul class="reflection-history-list" id="reflection-history-list"></ul></section>
  </main>
  <script src="script.js"></script>
</body>
</html>
